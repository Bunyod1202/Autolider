{% load static %}
<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imtihon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="container py-3">
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    <a class="btn btn-secondary" href="/bot/exams/?user_id={{ user.id }}">Ortga</a>
  {% else %}
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0">{{ exam.title }}</h6>
      <span id="timer" class="badge bg-primary">00:00:00</span>
    </div>
    <div id="quiz"></div>
    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-outline-secondary" id="prevBtn">Oldingi</button>
      <button class="btn btn-primary" id="nextBtn">Keyingi</button>
    </div>
  {% endif %}
</div>

<script>
const webApp = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (webApp) { try{ webApp.expand(); }catch(e){} }

const userId = "{{ user.id }}";
const attemptId = "{{ attempt.id }}";
const questions = {{ questions|safe }};
let idx = 0; // zero-based index
let seconds = 0; let timer = null;

function fmt(n){ n = parseInt(n,10); return (n<10?"0":"")+n; }
function renderTimer(){ const h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60; document.getElementById('timer').innerText = `${fmt(h)}:${fmt(m)}:${fmt(s)}` }
function startTimer(){ if (timer) return; timer=setInterval(()=>{seconds++; renderTimer();},1000) }
startTimer();

function render(){
  const q = questions[idx];
  const wrap = document.getElementById('quiz');
  let html = `<div class="card"><div class="card-body">`;
  html += `<div class='mb-2'><b>${q.order}/${questions.length}</b>. ${q.question}</div>`;
  if(q.image_url){ html += `<img src='${q.image_url}' class='img-fluid mb-2'/>`; }
  html += `<div>`;
  q.options.forEach(o=>{
    const active = (q.answer_id && q.answer_id===o.id) ? 'active' : '';
    html += `<button class='btn btn-light w-100 text-start mb-2 ${active}' data-oid='${o.id}' onclick='choose(${q.id},${o.id})'>${o.text}</button>`;
  });
  html += `</div></div></div>`;
  wrap.innerHTML = html;
  document.getElementById('prevBtn').disabled = (idx===0);
  document.getElementById('nextBtn').innerText = (idx===questions.length-1) ? 'Yakunlash' : 'Keyingi';
}

async function choose(qid, oid){
  const q = questions[idx];
  q.answer_id = oid;
  try{
    await fetch('/bot/exams/answer/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({user_id:userId, attempt_id:attemptId, question_id:qid, option_id:oid})});
  }catch(e){ console.error(e); }
  render();
}

document.getElementById('prevBtn').onclick = ()=>{ if(idx>0){ idx--; render(); }};
document.getElementById('nextBtn').onclick = async ()=>{
  if(idx < questions.length-1){ idx++; render(); return; }
  // Finish
  try{
    const res = await fetch('/bot/exams/finish/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({user_id:userId, attempt_id:attemptId, spent_seconds:seconds})});
    const data = await res.json();
    if(data.ok && data.result_url){ window.location.replace(data.result_url); return; }
  }catch(e){ console.error(e); }
};

render();
</script>
</body>
</html>
