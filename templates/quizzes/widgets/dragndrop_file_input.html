<style>
  .dnd-input-wrap { border: 2px dashed #bbb; border-radius: 8px; padding: 14px; text-align: center; cursor: pointer; background:#fafafa; }
  .dnd-input-wrap.is-dragover { border-color: #0d6efd; background:#f0f6ff; }
  .dnd-help { color:#666; font-size: 12px; margin-top: 6px; }
  .dnd-preview { margin-top:8px; max-width: 260px; display:none; border-radius:6px; }
</style>
{% with input_id=widget.attrs.id|default:widget.name %}
<div class="dnd-input" id="{{ input_id }}_container">
  <div class="dnd-input-wrap" id="{{ input_id }}_drop">
    <div>
      <strong>Rasmni bu yerga tashlang</strong>
    </div>
    <div class="dnd-help">yoki bosing va fayl tanlang</div>
    <input
      type="file"
      name="{{ widget.name }}"
      id="{{ input_id }}"
      accept="image/*"
      style="display:none"
      {% for attr, val in widget.attrs.items %}{% if attr != 'id' %} {{ attr }}="{{ val }}"{% endif %}{% endfor %}
    />
  </div>
  <img id="{{ input_id }}_preview" class="dnd-preview" alt="preview" />
</div>
<script>
  (function(){
    try {
      var drop = document.getElementById('{{ input_id }}_drop');
      var input = document.getElementById('{{ input_id }}');
      var preview = document.getElementById('{{ input_id }}_preview');
      var form = input && input.form;
      // Admin's image_url field (text input) – will be auto-filled after upload
      function findImageUrlInput(){
        if(!form) return document.querySelector('input[name="image_url"]');
        return form.querySelector('input[name="image_url"]') || document.querySelector('input[name="image_url"]');
      }

      // Resolve admin upload endpoint relative to model admin root
      function getUploadUrl(){
        // We registered admin url at /admin/quizzes/quiz/upload-image/
        // Use absolute path to avoid base tag issues
        return '/admin/quizzes/quiz/upload-image/';
      }

      function showPreview(file){
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }

      function handleFiles(files){
        if(!files || !files.length) return;
        var file = files[0];
        showPreview(file);
        // Upload immediately via AJAX; fill image_url on success
        uploadFile(file);
      }

      drop.addEventListener('click', function(){ input.click(); });
      input.addEventListener('change', function(){ handleFiles(input.files); });

      drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('is-dragover'); });
      drop.addEventListener('dragleave', function(){ drop.classList.remove('is-dragover'); });
      drop.addEventListener('drop', function(e){
        e.preventDefault();
        drop.classList.remove('is-dragover');
        handleFiles(e.dataTransfer.files);
      });

      function getCsrfToken(){
        // Prefer hidden input in admin form, fallback to cookie
        var tokInput = form ? form.querySelector('input[name="csrfmiddlewaretoken"]') : null;
        if (tokInput && tokInput.value) return tokInput.value;
        var m = document.cookie.match(/csrftoken=([^;]+)/);
        return m ? m[1] : '';
      }

      function uploadFile(file){
        var url = getUploadUrl();
        var fd = new FormData();
        fd.append('file', file, file.name || 'image');
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        try { xhr.setRequestHeader('X-CSRFToken', getCsrfToken()); } catch(e) {}
        xhr.onreadystatechange = function(){
          if(xhr.readyState === 4){
            try {
              var resp = JSON.parse(xhr.responseText || '{}');
              if(xhr.status >= 200 && xhr.status < 300 && resp.ok && resp.url){
                var urlInput = findImageUrlInput();
                if(urlInput){ urlInput.value = resp.url; }
              } else {
                console.error('Upload failed', resp);
                alert('Rasmni yuklab bo\'lmadi.');
              }
            } catch(err){ console.error(err); }
          }
        };
        xhr.send(fd);
      }
    } catch(e) { /* no-op */ }
  })();
  </script>
{% endwith %}
